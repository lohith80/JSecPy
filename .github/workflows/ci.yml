name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Test
        run: pytest -q

  self-scan:
    # Dogfood: JSecPy scans its own vulnerable fixtures and must find them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Scan fixtures to SARIF
        run: jsecpy tests/fixtures/vulnerable --format sarif -o jsecpy.sarif --no-banner --scan-tests || true
      - name: Assert findings were produced
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("jsecpy.sarif"))
          n = len(data["runs"][0]["results"])
          print(f"JSecPy self-scan produced {n} findings")
          sys.exit(0 if n >= 12 else 1)
          PY
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsecpy-sarif
          path: jsecpy.sarif
